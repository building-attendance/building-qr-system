<!doctype html>
<!--
  The player page of the provider tutorial video, one per language, at /video/<lang>/ of the published site. scripts/video/render-all.mjs
  fills the fields in double braces (each value HTML-escaped) and writes it beside the poster, the captions and the manifest. No script at all:
  the policy below lets the page load only its own files, and the preview of a shared link (WhatsApp) reads the Open Graph tags.
  The same file makes a second page per language, /video/<lang>/after-sign-in/, one folder deeper (the field "root" is the way back to the language
  folder): it starts the video at the first scene after the sign-in (the field "start", a media fragment) and keeps the part between the
  after-sign-in markers, a link back to the whole video. The home screen of the app links to it. The main page drops that part.
-->
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta property="og:type" content="video.other">
    <meta property="og:locale" content="{{locale}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{pageUrl}}">
    <meta property="og:image" content="{{posterUrl}}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="{{width}}">
    <meta property="og:image:height" content="{{height}}">
    <meta property="og:video" content="{{videoUrl}}">
    <meta property="og:video:secure_url" content="{{videoUrl}}">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="{{width}}">
    <meta property="og:video:height" content="{{height}}">
    <link rel="stylesheet" href="{{root}}../player.css">
  </head>
  <body>
    <main>
      <h1>{{title}}</h1>
      <p>{{description}}</p>
      <video controls playsinline preload="metadata" width="{{width}}" height="{{height}}" poster="{{root}}poster.jpg">
        <source src="{{root}}../{{lang}}.mp4{{start}}" type="video/mp4">
        <track kind="captions" src="{{root}}captions.vtt" srclang="{{lang}}" label="{{languageName}}">
        <a href="{{root}}../{{lang}}.mp4">{{title}}</a>
      </video>
      <!--after-sign-in-->
      <p><a href="../">{{fromStartText}}</a></p>
      <!--/after-sign-in-->
    </main>
  </body>
</html>
