# Continuous integration. Four checks, and branch protection (.github/rulesets/) requires all of them to merge:
#   guards                 migrations only move forward, tests are not removed, the PR title, ESLint, the type check,
#                          the size budget of the built app, an audit of the production dependencies (and a warning,
#                          never a failure, for the development ones)
#   unit                   Vitest, against a Postgres 18 container (production runs Postgres 18 on Neon), in 2 parts
#   e2e (android-chrome)   Playwright, Chromium as a Pixel 7, in 2 parts (e2e.yml)
#   e2e (iphone-webkit)    Playwright, WebKit as an iPhone 14, in 4 parts (e2e.yml)
#                          unit and each e2e check are small jobs that pass only when every one of their parts passed.
# They run on every pull request, on every push to the default branch and, once the repository has a merge queue, on each
# merge group (see the trigger below).
# Every third-party action is pinned to a full commit SHA (the tag is in the comment): a tag can be moved, a SHA cannot.
# The Postgres service image is pinned to a digest for the same reason.
name: CI

# master and main are the usual names of a default branch (master here, often main in a copy), like git.deploymentEnabled
# in vercel.json. A copy whose default branch has another name adds it to both lists below.
on:
  pull_request:
    branches: [master, main]
    # The default types plus the ones that change what the guards read, so that fixing the title or adding the
    # allow-test-removal label re-runs the checks (a plain re-run would still see the old title and labels).
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [master, main]
  # A merge queue (when the repository has one) tests each queued pull request on top of the default branch and of the
  # pull requests ahead of it, and merges only what passes. It waits for the same four checks, so they must run here too:
  # without this trigger a queued pull request would wait forever. Harmless when there is no queue: nothing sends it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guards diff against the base branch, so they need its history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # What to compare with: the target branch for a pull request, the previous tip for a push, and for a merge queue the
      # commit that the queued pull request is merged onto (the default branch plus the pull requests ahead of it), so the
      # diff is that pull request's own change. A branch that is new (all-zero SHA) or a force-pushed one (the old tip is
      # gone) has nothing to compare with: the diff guards skip.
      - name: Find the base commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="origin/$BASE_REF" ;;
            push) base="$BEFORE_SHA" ;;
            merge_group) base="$MERGE_GROUP_BASE" ;;
            *) base="origin/$DEFAULT_BRANCH" ;;
          esac
          if [ "$base" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            echo "No base commit to compare with ($base): skipping the migration and test guards."
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Migrations only move forward
        if: steps.base.outputs.base != ''
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: node scripts/check-migrations.mjs --base "$BASE"

      # Whether the branch that the change lands on (the target of a pull request, the pushed branch of a push) can only be
      # changed by a pull request whose `guards` check passed, as its active rulesets say: a `pull_request` rule, and a
      # `required_status_checks` rule that lists `guards` (GitHub returns each rule on its own, so both are looked for)
      # from GitHub Actions, `integration_id` 15368 as in .github/rulesets/master-gates.json. A `guards` that a ruleset
      # takes from another app, or from any source, could pass while this job failed, so it counts as "not required".
      # Reading them needs only the metadata permission, which the job's token always has. Only a push uses the answer
      # (the step below); a pull request prints it, so that every pull request run shows that the token can still read it.
      # An answer that cannot be read counts as "not required".
      - name: Rulesets require a pull request with guards green
        id: rules
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          query='any(.[]; .type == "pull_request") and
            any(.[]; .type == "required_status_checks" and
              any(.parameters.required_status_checks[]?; .context == "guards" and .integration_id == 15368))'
          if required=$(gh api "repos/$REPOSITORY/rules/branches/$BRANCH" --jq "$query"); then
            echo "A pull request with a green guards check is required to change $BRANCH: $required"
          else
            echo "::warning::Could not read the rulesets of $BRANCH: a push to it keeps the test guard."
            required=false
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      # PR_LABELS lets a pull request that has to remove a test say so with the allow-test-removal label.
      # Titles and labels are text that anyone can write: they go in through env and are read from process.env, never
      # pasted into the script of a `run:` step.
      # Not in a merge queue, and not on a push to a branch whose rulesets require a pull request with this job green (the
      # step above): neither run has pull request labels, so a removal that the owner allowed with the label would fail
      # there for good (the push of #207's merge did, on 13/10/2026). The same change was already checked, with its labels,
      # by the pull request's own run, which it needs green before it can join the queue or merge (like the title check
      # below). Any other push is still checked: the one commit that docs/install.md pushes before the rulesets, a push to
      # a copy without them or whose rulesets do not require `guards`, and a push whose rulesets could not be read.
      - name: Tests are not removed or switched off
        if: >-
          steps.base.outputs.base != '' && github.event_name != 'merge_group' &&
          (github.event_name != 'push' || steps.rules.outputs.required != 'true')
        env:
          BASE: ${{ steps.base.outputs.base }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-tests.mjs --base "$BASE"

      - name: Pull request title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs

      # The guard scripts above use Node built-ins only and `npm audit` reads the lock file: only ESLint and the type check
      # need the dependencies, so the install sits right before them.
      - run: npm ci
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Builds the app and checks its size against scripts/check-bundle-size.json (the JavaScript and the CSS of each app and
      # the precache that every phone downloads, brotli-compressed). It needs no secret and no environment variable.
      - name: Build the app and check it against the size budget
        run: npm run size

      - name: Audit the production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The development dependencies (Vite, Vitest, Playwright, ESLint and the rest) build and test the app but never reach
      # a phone or the server, so an advisory in one of them does not block a merge: it becomes a warning on the run, and
      # Dependabot's security update proposes the fix. This step runs only after the one above passed, so a high or
      # critical advisory that it finds is in a development dependency.
      - name: Report the development dependencies' advisories
        run: |
          if ! npm audit --audit-level=high > "$RUNNER_TEMP/audit.txt"; then
            cat "$RUNNER_TEMP/audit.txt"
            echo "::warning title=Development dependency advisory::npm audit found a high or critical advisory in a development dependency (the log of this step lists it). It does not block the merge; update it, or merge the Dependabot pull request that fixes it."
          fi

  # The unit tests in parts side by side, each part a job with its own Postgres container that runs its share of the test
  # files (Vitest --shard: 54 and 53 of 107 files). The required check `unit` is the small job after them, which passes only
  # when every part passed, like the e2e checks below.
  unit-parts:
    name: unit part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    services:
      postgres:
        # Pinned to a digest, like the actions: the tag postgres:18 moves with every patch release. This is the multi-arch
        # index of postgres:18 as Docker Hub had it on 2026-10-02. It is updated by hand (Dependabot does not update
        # service-container images in a workflow): to move it, resolve postgres:18 again and replace the digest here and in
        # e2e.yml.
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Plain URLs without sslmode, so the container is reached without TLS (see normalizeConnectionString in server/db.js).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run this part of the tests
        env:
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: npx vitest run --shard="$PART/$PARTS" --reporter=default --reporter=github-actions

  unit:
    name: unit
    needs: unit-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.unit-parts.result }}
        run: |
          echo "The parts of unit: $RESULT"
          [ "$RESULT" = success ]

  # The end-to-end tests: one call of e2e.yml per Playwright project, which runs the project in parts side by side (each
  # with its own Postgres container), then one job per project that is the required check. It is named exactly like the
  # check of the rulesets and passes only when every part passed: a part that failed, was cancelled or was skipped (or a
  # call that never ran) fails it, so a check can never turn green by itself. `always()` makes it run, and report, in
  # every one of those cases. WebKit is the slowest project, so it has the most parts. The files of a project are split
  # between its parts by the seconds that each file takes (e2e/parts.js and e2e/part-weights.json), not by the number
  # of tests, so that its parts take about as long as each other.
  e2e-android-chrome-parts:
    name: e2e (android-chrome) parts
    uses: ./.github/workflows/e2e.yml
    with:
      project: android-chrome
      browser: chromium
      parts: "[1, 2]"

  e2e-iphone-webkit-parts:
    name: e2e (iphone-webkit) parts
    uses: ./.github/workflows/e2e.yml
    with:
      project: iphone-webkit
      browser: webkit
      parts: "[1, 2, 3, 4]"

  e2e-android-chrome:
    name: e2e (android-chrome)
    needs: e2e-android-chrome-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.e2e-android-chrome-parts.result }}
        run: |
          echo "The parts of android-chrome: $RESULT"
          [ "$RESULT" = success ]

  e2e-iphone-webkit:
    name: e2e (iphone-webkit)
    needs: e2e-iphone-webkit-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.e2e-iphone-webkit-parts.result }}
        run: |
          echo "The parts of iphone-webkit: $RESULT"
          [ "$RESULT" = success ]
