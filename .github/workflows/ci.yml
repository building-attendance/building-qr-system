# The tests: three of the four checks that branch protection (.github/rulesets/) requires to merge.
#   unit                   Vitest, against a Postgres 18 container (production runs Postgres 18 on Neon), in 2 parts
#   e2e (android-chrome)   Playwright, Chromium as a Pixel 7, in 3 parts (e2e.yml)
#   e2e (iphone-webkit)    Playwright, WebKit as an iPhone 14, in 4 parts (e2e.yml)
#                          unit and each e2e check are small jobs that pass only when every one of their parts passed.
# The fourth, `guards`, is guards.yml, whose header says why it is a workflow of its own.
# They run on every change of a pull request's code, on every push to the default branch and, once the repository has a
# merge queue, on each merge group (see the trigger below).
# Every third-party action is pinned to a full commit SHA (the tag is in the comment): a tag can be moved, a SHA cannot.
# The Postgres service image is pinned to a digest for the same reason.
name: CI

# master and main are the usual names of a default branch (master here, often main in a copy), like git.deploymentEnabled
# in vercel.json. A copy whose default branch has another name adds it to both lists below, and to those of guards.yml.
on:
  pull_request:
    branches: [master, main]
    # Only the types that change the code under test. A change of the title, the description, the labels or the base
    # branch (edited, labeled, unlabeled) runs guards.yml alone, and adding one of those types here would either run the
    # tests again for nothing or, with an `if:` that skips them, report skipped checks that GitHub counts as passed
    # (guards.yml says more). A pull request moved to another base branch runs the tests at its next push, or when it is
    # closed and reopened.
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]
  # A merge queue (when the repository has one) tests each queued pull request on top of the default branch and of the
  # pull requests ahead of it, and merges only what passes. It waits for the same four checks, so they must run here (and
  # in guards.yml) too: without this trigger a queued pull request would wait forever. Harmless when there is no queue:
  # nothing sends it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests in parts side by side, each part a job with its own Postgres container that runs its share of the test
  # files (Vitest --shard, split by the seconds of each file, not by their count: tests/time-sequencer.js). The required
  # check `unit` is the small job after them, which passes only when every part passed, like the e2e checks below.
  unit-parts:
    name: unit part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    services:
      postgres:
        # Pinned to a digest, like the actions: the tag postgres:18 moves with every patch release. This is the multi-arch
        # index of postgres:18 as Docker Hub had it on 2026-10-02. It is updated by hand (Dependabot does not update
        # service-container images in a workflow): to move it, resolve postgres:18 again and replace the digest here and in
        # e2e.yml.
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Plain URLs without sslmode, so the container is reached without TLS (see normalizeConnectionString in server/db.js).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # --shard splits the test files by how long each takes (tests/time-sequencer.js, the weights of "unit" in
      # e2e/part-weights.json), and the JSON report keeps this part's timings for the next weights.
      - name: Run this part of the tests
        env:
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: npx vitest run --shard="$PART/$PARTS" --reporter=default --reporter=github-actions --reporter=json --outputFile.json=vitest-timings.json
      - name: Keep the timings of this part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-unit-part-${{ matrix.part }}
          path: vitest-timings.json
          retention-days: 7
          if-no-files-found: ignore

  unit:
    name: unit
    needs: unit-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.unit-parts.result }}
        run: |
          echo "The parts of unit: $RESULT"
          [ "$RESULT" = success ]

  # The end-to-end tests: one call of e2e.yml per Playwright project, which runs the project in parts side by side (each
  # with its own Postgres container), then one job per project that is the required check. It is named exactly like the
  # check of the rulesets and passes only when every part passed: a part that failed, was cancelled or was skipped (or a
  # call that never ran) fails it, so a check can never turn green by itself. `always()` makes it run, and report, in
  # every one of those cases. WebKit is the slowest project, so it has the most parts. The files of a project are split
  # between its parts by the seconds that each file takes (e2e/parts.js and e2e/part-weights.json), not by the number
  # of tests, so that its parts take about as long as each other.
  e2e-android-chrome-parts:
    name: e2e (android-chrome) parts
    uses: ./.github/workflows/e2e.yml
    with:
      project: android-chrome
      browser: chromium
      parts: "[1, 2, 3]"

  e2e-iphone-webkit-parts:
    name: e2e (iphone-webkit) parts
    uses: ./.github/workflows/e2e.yml
    with:
      project: iphone-webkit
      browser: webkit
      parts: "[1, 2, 3, 4]"

  e2e-android-chrome:
    name: e2e (android-chrome)
    needs: e2e-android-chrome-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.e2e-android-chrome-parts.result }}
        run: |
          echo "The parts of android-chrome: $RESULT"
          [ "$RESULT" = success ]

  e2e-iphone-webkit:
    name: e2e (iphone-webkit)
    needs: e2e-iphone-webkit-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.e2e-iphone-webkit-parts.result }}
        run: |
          echo "The parts of iphone-webkit: $RESULT"
          [ "$RESULT" = success ]
