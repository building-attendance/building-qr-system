# Auto-merge of one narrow class of pull requests: tests and docs that the owner opened, when everything about them is
# clean. The rule is AGENTS.md, "Git and pull requests" (the paragraph "One workflow may merge too", owner decision of
# 16/10/2026). The decision is scripts/check-auto-merge.mjs, with a test for each condition (tests/check-auto-merge.test.js):
# it reads the pull request through GitHub's API and decides, and this file acts on its answer.
#
# LIVE by the owner's decision of 18/10/2026, after a dry run on #264 to #277: when every condition holds, the merge job
# merges. The workflow writes one comment per head commit of an open, ready pull request whose title is a test or docs
# title (edited when the decision for that commit changes, never duplicated), and the summary of the run for every pull
# request. With LIVE false (the dry run) the merge job is skipped, and the decision is only written. Turning LIVE on or off
# is the owner's decision, written in a pull request of its own (a P1 item of the Code Review Rules).
#
# When it runs: after every run of CI (workflow_run), and when the Codex review bot writes or edits a comment on a pull
# request (issue_comment: a clean review ends with a new receipt comment and an edit of the bot's summary comment). Both
# events run this file, and the decision script, as they are on the default branch, never a pull request's copies, so a
# pull request cannot widen its own gate. There is no pull_request, pull_request_target or pull_request_review trigger:
# pull_request and pull_request_review run the workflow file of the pull request's merge ref, and pull_request_target
# hands the base's secrets to a run that any pull request starts.
#
# What it reads: the pull request, its files and its commits, the check runs of its head commit, how far the head is behind
# the default branch, and the pull request's comments and review conversations, through the API with the job's own token
# (`node scripts/check-auto-merge.mjs --read`). Nothing of the pull request is checked out or run (no `npm ci` either): the
# only checkout is this commit of the default branch, for the decision script and .nvmrc, without credentials. Text that
# anyone can write (a title, a branch name, a file name, a comment) never reaches a `run:` script: the script reads it as
# JSON, and only its answer is used, through files and env.
#
# Fail closed: an API error stops the job, so nothing is merged, and the script refuses anything that it cannot read in
# full. The merge job reads everything again and decides again just before the merge, so that a change without a new
# commit (a label, the title, a new Codex finding) still stops it, and the merge is pinned to the head commit that was
# decided on (`sha`), so GitHub refuses it when anything was pushed in between.
#
# The merge is a job of its own in the environment `auto-merge`, and runs only while LIVE is true. That environment holds
# the two secrets of the auto-merge GitHub App (its client id and its private key), and its deployment branch policy lets
# only the default branch read them, with `deployment: false` too (a job of another branch was refused before it started,
# 18/10/2026). The job mints a token of the App that can only write contents (what a merge needs), for this repository and
# for this job only, and merges with the squash method. The App bypasses only the approval
# (master-approval), never master-gates: the four checks, an up-to-date branch, resolved conversations and the squash merge
# still hold. The App's setup, and how to switch it off: .github/rulesets/README.md, "The auto-merge App".
#
# Every third-party action is pinned to a full commit SHA (the tag is in the comment), like in ci.yml.
name: Auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions: {}

env:
  # The switch: true merges, false is the dry run (the decision is written, nothing is merged). Only the owner changes it,
  # in a pull request of its own that says so (AGENTS.md, Code Review Rules). true by the owner's decision, 18/10/2026.
  LIVE: true

jobs:
  decide:
    name: decide
    # Evaluated before a runner starts, so a comment of anybody else costs nothing:
    #   workflow_run   a CI run of a pull request from a branch of this repository (a fork's run carries no pull request);
    #   issue_comment  a comment of the Codex review bot on an open pull request (REST names the bot with [bot]).
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the checkout of the decision script, the files of the pull request and the comparison with the default branch
      pull-requests: write # read the pull request, its comments and conversations; write the decision comment
      checks: read # the check runs of the head commit
    # One decision at a time per pull request, at the job level so that a skipped run (any other comment) never queues. A
    # run that is going is never cancelled half way through its comment; a newer event replaces one that is still waiting.
    concurrency:
      group: auto-merge-decide-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    outputs:
      live: ${{ env.LIVE }}
      merge: ${{ steps.decide.outputs.merge }}
      number: ${{ steps.decide.outputs.number }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      comment_id: ${{ steps.comment.outputs.comment_id }}
    steps:
      # The commit of the default branch that this run's workflow file comes from (github.sha, for both events), so the
      # script is the one reviewed with this file. Only the script and .nvmrc, and no credentials left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/check-auto-merge.mjs
            /.nvmrc
          sparse-checkout-cone-mode: false
      # No cache: nothing is installed, and a cache saved by a run of the default branch could be read by every pull request.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Read the pull request and decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/auto-merge"
          mkdir -p "$dir"
          node scripts/check-auto-merge.mjs --read > "$dir/decision.json"
          # The reasons are the script's own sentences; any text of the pull request in them is reduced to plain characters.
          jq -r '"Decision for #\(.number) at \(.head_sha): " + (if .merge == true then "merge" else "no merge" end), (.reasons[] | "  - " + .)' "$dir/decision.json"
          jq -r '.summary' "$dir/decision.json" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "merge=$(jq -r 'if .merge == true then "true" else "false" end' "$dir/decision.json")"
            echo "number=$(jq -r '.number' "$dir/decision.json")"
            echo "head_sha=$(jq -r '.head_sha' "$dir/decision.json")"
            echo "post=$(jq -r 'if .comment.post == true then "true" else "false" end' "$dir/decision.json")"
          } >> "$GITHUB_OUTPUT"

      # The comment of this head commit: edited when it exists (the script found it among the comments of the workflow's
      # own account), written once otherwise.
      - name: Write the decision on the pull request
        id: comment
        if: steps.decide.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.decide.outputs.number }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/auto-merge"
          jq '{body: .comment.body}' "$dir/decision.json" > "$dir/comment.json"
          id=$(jq -r '.comment.id // empty' "$dir/decision.json")
          if [[ "$id" =~ ^[1-9][0-9]*$ ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" --input "$dir/comment.json" > /dev/null
          else
            id=$(gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$dir/comment.json" --jq '.id')
          fi
          echo "comment_id=$id" >> "$GITHUB_OUTPUT"

  merge:
    name: merge
    needs: decide
    # Skipped while LIVE is false (the dry run), whatever the decision says.
    if: needs.decide.outputs.live == 'true' && needs.decide.outputs.merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The App's secrets live only here. No deployment object: the environment is only where the secrets are kept.
    environment:
      name: auto-merge
      deployment: false
    permissions:
      contents: read # the checkout of the decision script, and the files and the comparison that it reads again
      pull-requests: write # read the pull request again; the comment after the merge (the merge itself uses the App's token)
      checks: read # the check runs of the head commit, read again
    concurrency:
      group: auto-merge-merge-${{ needs.decide.outputs.number }}
      cancel-in-progress: false
    steps:
      # The same checkout as in decide: the decision script of the default branch, without credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/check-auto-merge.mjs
            /.nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # A token of the auto-merge App for this repository only, with contents: write only (what a merge needs), revoked by
      # the action when the job ends. The secrets are read here and nowhere else, and never printed.
      - name: Mint a token of the auto-merge App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_KEY }}
          permission-contents: write

      # The decision of the decide job may be minutes old. Everything is read again, with the job's own token, and the merge
      # goes ahead only when the decision is still to merge, and for the same head commit.
      - name: Decide again, just before the merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ needs.decide.outputs.number }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/check-auto-merge.mjs --read > "$RUNNER_TEMP/again.json"
          if ! jq -e --arg sha "$HEAD_SHA" '.merge == true and .head_sha == $sha and .merge_request.sha == $sha and .merge_request.merge_method == "squash"' "$RUNNER_TEMP/again.json" > /dev/null; then
            echo "::error::The decision changed since the decide job, or the head moved: no merge."
            jq -r '.reasons[] | "  - " + .' "$RUNNER_TEMP/again.json"
            exit 1
          fi
          jq '.merge_request' "$RUNNER_TEMP/again.json" > "$RUNNER_TEMP/merge.json"
          jq '{body: .merged_body}' "$RUNNER_TEMP/again.json" > "$RUNNER_TEMP/merged.json"

      # The body is the script's mergeRequest: sha (the head that was decided on), squash, and the decided title and message.
      # GitHub answers 409 when the head moved, 405 when a ruleset refuses, and the job fails.
      - name: Merge the head commit that was decided on
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.decide.outputs.number }}
        run: |
          set -euo pipefail
          merged=$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" --input "$RUNNER_TEMP/merge.json" --jq '.merged')
          if [ "$merged" != "true" ]; then
            echo "::error::GitHub did not merge the pull request."
            exit 1
          fi

      - name: Say so on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.decide.outputs.number }}
          COMMENT_ID: ${{ needs.decide.outputs.comment_id }}
        run: |
          set -euo pipefail
          if [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" --input "$RUNNER_TEMP/merged.json" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/merged.json" > /dev/null
          fi

      # The comment of the decision said "merging": when the merge did not go through (the decision changed, the merge
      # failed, or a step before it did), the comment says so. A failure of the comment after a merge that went through
      # changes nothing.
      - name: Say that the merge did not go through
        if: failure() && steps.merge.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.decide.outputs.number }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          COMMENT_ID: ${{ needs.decide.outputs.comment_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$HEAD_SHA" --arg run "$RUN_URL" \
            '{body: "<!-- auto-merge:v1 head=\($sha) -->\n### Auto-merge: the merge of `\($sha[0:7])` did not go through\n\nNothing was merged. The run says why: \($run). The owner merges as usual."}' \
            > "$RUNNER_TEMP/failed.json"
          if [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" --input "$RUNNER_TEMP/failed.json" > /dev/null
          elif [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/failed.json" > /dev/null
          fi
