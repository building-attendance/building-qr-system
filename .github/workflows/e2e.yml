# One Playwright project of the end-to-end tests, in parts that run side by side, each part a job with its own Postgres
# container, its own build and its own scratch schema. ci.yml calls this once per project, and a small job there, named
# exactly like the required check (`e2e (android-chrome)`, `e2e (iphone-webkit)`), passes only when every part passed. So
# the four required checks of .github/rulesets/ keep their names, and a copy's rulesets need no change.
#
# Why parts: the WebKit project took about 7 minutes and set the length of every CI run, of which about 6 were the tests.
# Each part pays the setup again (the container, npm ci, the browser, the build) but runs a share of the test files, chosen
# by e2e/parts.js from the project's full list by the seconds each file takes (e2e/part-weights.json), so that the parts
# take about as long as each other. Playwright's --shard split by the number of tests instead, and one part got the slowest
# files and ran about twice as long as the next (#218). Every file of the list is in exactly one part.
#
# It runs only when ci.yml calls it, under ci.yml's trigger, concurrency and permissions. Every third-party action is
# pinned to a full commit SHA, the same ones as in ci.yml, and every value that a `run:` script reads goes in through env.
name: E2E parts

on:
  workflow_call:
    inputs:
      project:
        description: The Playwright project (playwright.config.js), for example iphone-webkit
        required: true
        type: string
      browser:
        description: The browser that the project needs, for npx playwright install (chromium or webkit)
        required: true
        type: string
      parts:
        description: The numbers of the parts, as a JSON list, for example [1, 2, 3]. Their count is the number of shards.
        required: true
        type: string

permissions:
  contents: read

jobs:
  part:
    name: e2e (${{ inputs.project }}) part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722 # the same digest as in ci.yml
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only the browser this project needs. Playwright's own advice is not to cache the browsers, so they are downloaded.
      # --with-deps runs apt-get on the runner, and a slow Ubuntu mirror has made it hang until the job's 30-minute limit
      # (twice, on 06/10 and 07/10/2026). So each attempt gets 5 minutes and there are up to three: a hang costs minutes,
      # not the job. Between attempts, whatever apt-get or dpkg left behind is stopped and finished, so that the next
      # attempt does not wait for a lock.
      - name: Install the browser and its system packages
        timeout-minutes: 17
        env:
          BROWSER: ${{ inputs.browser }}
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=10 300 npx playwright install --with-deps "$BROWSER"; then exit 0; fi
            echo "::warning::Installing $BROWSER failed or took more than 5 minutes (attempt $attempt of 3)"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
          done
          exit 1
      # e2e/parts.js asks Playwright for the project's test files and writes this part's share of them to a list; it
      # fails (and so does the part) when Playwright lists nothing or the part would get no file. --test-list then runs
      # exactly those files. playwright.config.js builds the app and starts the API (on a scratch schema of this part's
      # container) and the preview.
      - name: Run this part of the tests
        env:
          PROJECT: ${{ inputs.project }}
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: |
          node e2e/parts.js --project="$PROJECT" --part="$PART" --parts="$PARTS" --out="$RUNNER_TEMP/test-list.txt"
          npx playwright test --project="$PROJECT" --test-list="$RUNNER_TEMP/test-list.txt"
      # How long each test of this part took (the JSON report of playwright.config.js on CI), kept whether the part passed
      # or not: the weights in e2e/part-weights.json are made from the reports of a green run (docs/testing.md, "CI").
      - name: Keep the timings of this part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ inputs.project }}-part-${{ matrix.part }}
          path: playwright-timings.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the report and the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ inputs.project }}-part-${{ matrix.part }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
